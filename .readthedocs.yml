version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: latest
  jobs:
    post_checkout:
      - git fetch --unshallow || true

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# Don't build any extra formats
formats: []
