[build-system]
requires = [
    "setuptools>=77.0.0",
    "setuptools_scm>=8.0.0",
    "extension-helpers>=1.4,<2",
    "numpy>=2.0.0",
    "Cython>=3.1,<4",
]
build-backend = 'setuptools.build_meta'

[project]
name = "mpdaf"
authors = [
    {name = "Laure Piqueras", email = "laure.piqueras@univ-lyon1.fr"},
    {name = "Simon Conseil", email = "simon.conseil@univ-lyon1.fr"},
]
description = "Framework for MUSE data analysis"
readme = "README.rst"
requires-python = ">=3.11"
keywords = ["astronomy", "astrophysics", "science", "muse", "vlt", "cube",
            "image", "spectrum"]
license = "BSD-3-Clause"
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "astropy",
    "matplotlib",
    "numpy>=2.0",
    "scipy>=1.13",
    "specutils>=2.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
all = ["adjustText", "fitsio", "joblib", "numexpr", "regions", "tqdm"]
docs = [
    "ipython",
    "numpydoc",
    "pickleshare",
    "psutil",
    "pytest-doctestplus",
    "sphinx",
    "sphinx_automodapi",
    "sphinx_rtd_theme",
]
tests = ["pytest", "pytest-astropy", "pytest-cov", "pytest-remotedata"]

[project.scripts]
make_white_image = "mpdaf.scripts.make_white_image:main"

[project.urls]
documentation = "https://mpdaf.readthedocs.io"
gitlab = "https://git-cral.univ-lyon1.fr/MUSE/mpdaf"
github = "https://github.com/musevlt/mpdaf"

[tool.setuptools.packages.find]
where = ["lib"]

[tool.setuptools.package-data]
mpdaf = ["data/**"]
"mpdaf.drs" = ["mumdatMask_1x1/PAE_July2013.fits.gz"]
"mpdaf.obj" = ["filters/filter_list.fits"]
"mpdaf.sdetect" = ["muselet_data/*", "sea_data/*"]

[tool.setuptools_scm]
version_file = "lib/mpdaf/_version.py"

[tool.pytest]
minversion = "9.0"
testpaths = ["lib"]
addopts = [
    "--doctest-modules",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = [
    # action:message:category:module:lineno
    "error",
    "ignore::astropy.io.fits.verify.VerifyWarning",
    "ignore::astropy.units.UnitsWarning",
    "ignore::astropy.wcs.FITSFixedWarning",
]
markers = ["slow"]

[tool.ruff.lint]
select = [
  "E", "F", "W", # flake8
  "I",           # isort
  "UP",          # pyupgrade
]
ignore = [
    "E501", # Line too long
    "E741", # ambiguous-variable-name
    "UP031", # printf-string-formatting
]
unfixable = [
  "F841", # Removes unused variables
]

[tool.ruff.lint.isort]
known-first-party = ["mpdaf"]

[tool.coverage.run]
source = ["mpdaf"]
omit = [
    "*/mpdaf/__init__*",
    "*/mpdaf/**/conftest.py",
    "*/mpdaf/**/setup*",
    "*/mpdaf/**/tests/*",
    "*/mpdaf/_version*",
    "*/mpdaf/scripts/update_license.py",
]

[tool.coverage.paths]
source = ["lib", "*/site-packages"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "except KeyboardInterrupt",
    "except ImportError",
]

[tool.cibuildwheel]
build-verbosity = 3
skip = ["*-win32", "*-*linux_i686", "cp3??t-*", "*-musllinux_x86_64"]
environment = { CFLAGS="-std=c99", PIP_PREFER_BINARY=1 }
test-command = "pytest {project}/lib"
test-extras = ["tests"]

[tool.cibuildwheel.linux]
# manylinux2014 builds occur inside a CentOS container
before-all = [
  "yum install cfitsio -y",
]
environment = { USEOPENMP=0, CFLAGS="-std=c99", PIP_PREFER_BINARY=1  }
